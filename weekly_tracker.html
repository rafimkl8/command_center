<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week-by-Week Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Geist', sans-serif; background: #eef2f6; color: #11181c; padding: 18px 12px 60px; }
  .wrap { max-width: 880px; margin: 0 auto; }

  .header { background: linear-gradient(135deg,#1d4ed8,#7c3aed); color:#fff; border-radius:14px; padding:18px 20px; margin-bottom:14px; }
  .header h1 { font-size:19px; font-weight:700; }
  .header .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .header label { font-size:12px; opacity:.9; }
  .header select { font-family:inherit; font-size:13px; font-weight:600; padding:5px 9px; border-radius:7px; border:none; color:#11181c; }
  .saved { font-size:10px; opacity:.85; font-family:'Geist Mono',monospace; margin-left:auto; }

  .tabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .tb { padding:9px 15px; border-radius:22px; font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid #d4dbe0; background:#fff; color:#5b6770; }
  .tb.active { background:#11181c; color:#fff; border-color:#11181c; }
  .tb .cnt { font-family:'Geist Mono',monospace; font-size:10px; background:#ef4444; color:#fff; border-radius:9px; padding:1px 6px; margin-left:4px; }
  .tb.active .cnt { background:#fff; color:#ef4444; }

  .view { display:block; }
  .view.hidden { display:none; }

  .card { background:#fff; border-radius:12px; padding:15px 17px; margin-bottom:14px; box-shadow:0 2px 8px rgba(0,0,0,.05); }

  .weekbar { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .weekbar button.nav { width:30px; height:30px; border-radius:8px; border:1px solid #d4dbe0; background:#f8fafc; font-size:15px; cursor:pointer; color:#11181c; }
  .weekbar select { font-family:inherit; font-size:13px; padding:7px 10px; border-radius:8px; border:1px solid #d4dbe0; background:#f8fafc; font-weight:600; flex:1; min-width:180px; }
  .weekbar .hrs { font-family:'Geist Mono',monospace; font-size:11px; color:#b45309; background:#fef6ec; padding:5px 9px; border-radius:7px; white-space:nowrap; }
  .weekbar .pct { font-family:'Geist Mono',monospace; font-size:12px; font-weight:700; color:#16a34a; white-space:nowrap; }

  .phasetag { font-size:10px; color:#7c3aed; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
  .badgerow { display:flex; gap:5px; margin-bottom:10px; flex-wrap:wrap; }
  .bdg { font-size:9px; font-weight:700; padding:2px 7px; border-radius:8px; text-transform:uppercase; letter-spacing:.04em; }
  .bdg.exam { background:#fde8e8; color:#c2410c; }
  .bdg.project { background:#f1eafd; color:#6d28d9; }
  .bdg.new { background:#e6f6ec; color:#15803d; }
  .bdg.critical { background:#fdeee2; color:#c2410c; }

  .grp { font-size:11px; font-weight:700; color:#38444c; margin:14px 0 5px; display:flex; align-items:center; gap:7px; }
  .grp .gh { font-family:'Geist Mono',monospace; font-size:9.5px; color:#8a949c; font-weight:500; }
  .grp .ess { font-size:8.5px; font-weight:700; color:#fff; background:#ef4444; border-radius:6px; padding:1px 6px; letter-spacing:.03em; }

  label.chk { display:flex; align-items:flex-start; gap:9px; font-size:12.5px; color:#38444c; line-height:1.45; padding:5px 0; cursor:pointer; border-bottom:1px solid #f0f3f5; }
  label.chk:last-child { border-bottom:none; }
  label.chk input { width:16px; height:16px; margin-top:1px; accent-color:#2563eb; cursor:pointer; flex-shrink:0; }
  label.chk.done span { text-decoration:line-through; color:#aeb6bc; }

  .note { font-size:11px; color:#5b6770; line-height:1.55; background:#f5f8fa; border-left:3px solid #d4dbe0; border-radius:6px; padding:9px 11px; margin-top:14px; }
  .note strong { color:#11181c; }

  .rem-head { font-size:12px; color:#5b6770; margin-bottom:14px; line-height:1.5; }
  .rem-head b { color:#c2410c; }
  .rem-sec-title { font-size:12px; font-weight:700; margin:16px 0 6px; }
  .rem-empty { font-size:12px; color:#16a34a; padding:10px 0; }
  label.rem { display:flex; align-items:flex-start; gap:9px; font-size:12px; color:#38444c; line-height:1.4; padding:6px 0; border-bottom:1px solid #f0f3f5; cursor:pointer; }
  label.rem input { width:15px; height:15px; margin-top:1px; cursor:pointer; flex-shrink:0; }
  label.rem .wn { font-family:'Geist Mono',monospace; font-size:10px; font-weight:700; min-width:34px; flex-shrink:0; }
  label.rem .ct { font-size:9px; color:#8a949c; }
  .p1 label.rem input { accent-color:#ef4444; }
  .p1 .wn { color:#c2410c; }
  .p2 label.rem input { accent-color:#d97706; }
  .p2 .wn { color:#b45309; }
  .p3 label.rem input { accent-color:#16a34a; }
  .p3 .wn { color:#15803d; }

  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-bottom:14px; }
  .stat { background:#fff; border-radius:11px; padding:13px 8px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.05); }
  .stat .n { font-family:'Geist Mono',monospace; font-size:21px; font-weight:700; color:#1d4ed8; }
  .stat input { width:100%; border:none; text-align:center; font-family:'Geist Mono',monospace; font-size:21px; font-weight:700; color:#7c3aed; background:transparent; }
  .stat input:focus { outline:none; background:#f3f0fb; border-radius:5px; }
  .stat .l { font-size:9px; color:#8a949c; margin-top:5px; text-transform:uppercase; letter-spacing:.03em; }
  @media (max-width:620px){ .stats{ grid-template-columns:repeat(2,1fr);} }

  .progwrap { margin-bottom:12px; }
  .progwrap .lab { display:flex; justify-content:space-between; font-size:11px; color:#5b6770; margin-bottom:6px; font-weight:600; }
  .track { height:11px; background:#e3e8ec; border-radius:6px; overflow:hidden; }
  .fill { height:100%; border-radius:6px; transition:width .3s; }
  .foot { text-align:center; font-size:10px; color:#8a949c; font-style:italic; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>📅 Week-by-Week Tracker</h1>
    <div class="row">
      <label for="curSel">I'm currently on</label>
      <select id="curSel"></select>
      <span class="saved" id="savedMsg">Auto-saved in this browser ✓</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tb active" id="tab-weekly" data-v="weekly">📋 Weekly</button>
    <button class="tb" id="tab-remaining" data-v="remaining">🔥 Remaining <span class="cnt" id="remCnt">0</span></button>
    <button class="tb" id="tab-overview" data-v="overview">📊 Overview</button>
  </div>

  <div class="view" id="view-weekly">
    <div class="card">
      <div class="weekbar">
        <button class="nav" id="prevW">‹</button>
        <select id="weekSel"></select>
        <button class="nav" id="nextW">›</button>
        <span class="hrs" id="weekHrs"></span>
        <span class="pct" id="weekPct"></span>
      </div>
      <div id="weekMeta"></div>
      <div id="weekBody"></div>
    </div>
  </div>

  <div class="view hidden" id="view-remaining">
    <div class="card">
      <div class="rem-head" id="remHead"></div>
      <div id="remBody"></div>
    </div>
  </div>

  <div class="view hidden" id="view-overview">
    <div class="stats">
      <div class="stat"><div class="n" id="ovWeeks">0</div><div class="l">Weeks complete /40</div></div>
      <div class="stat"><div class="n" id="ovTasks">0</div><div class="l">Tasks done</div></div>
      <div class="stat"><div class="n" id="ovHours">0</div><div class="l">Hours done</div></div>
      <div class="stat"><div class="n" id="ovEss" style="color:#ef4444">0</div><div class="l">Essentials left</div></div>
    </div>
    <div class="card">
      <div class="progwrap"><div class="lab"><span>Tasks completed</span><span id="ovTaskPct">0%</span></div><div class="track"><div class="fill" id="ovTaskFill" style="background:linear-gradient(90deg,#2563eb,#16a34a)"></div></div></div>
      <div class="progwrap"><div class="lab"><span>Hours invested (of <span id="ovTotH">0</span>h)</span><span id="ovHourPct">0%</span></div><div class="track"><div class="fill" id="ovHourFill" style="background:linear-gradient(90deg,#d97706,#16a34a)"></div></div></div>
      <div class="foot">A week counts as "complete" only when every task in it is ticked.</div>
    </div>
    <div class="stats">
      <div class="stat"><input type="number" id="leetcode" min="0" value="0"><div class="l">LeetCode solved</div></div>
      <div class="stat"><input type="number" id="streak" min="0" value="0"><div class="l">Commit streak</div></div>
      <div class="stat"><input type="number" id="articles" min="0" value="0"><div class="l">Articles</div></div>
      <div class="stat"><input type="number" id="apps" min="0" value="0"><div class="l">Apps sent</div></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="sync.js"></script>
<script>
var WEEKS = [{"n":1,"title":"Web Essentials + Python Basics","phase":"Python Foundations + Web Basics","badges":["critical"],"hrs":38,"cats":{"course":["Web fundamentals — client/server, request-response, static vs dynamic, front vs back end","Python intro — variables, data types, type conversion, mutable vs immutable, comments"],"extra":["Install Python 3.12, VSCode, Pylint, GitLens, Prettier extensions","CS50P Week 0 on YouTube — clearest Python intro that exists","Read: How the Internet Works in 5 Minutes (article)","Open Chrome DevTools → Network tab → visit any website → watch real HTTP requests happen"],"leet":["Create HackerRank account — set language to Python3","HackerRank: Say Hello World, Python If-Else, Arithmetic Operators","Create LeetCode account — bookmark the Easy problems list"],"project":["Script 1: user inputs name + birth year → prints age and generation (Millennial/GenZ)","Script 2: calculator — takes 2 numbers + operator, handles division by zero","Push both to GitHub repo called python-fundamentals with a README"],"git":["Install Git — configure user.name and user.email","Memorize: git init · git add · git commit · git push · git status · git pull","Create GitHub account — professional username, real photo, Dhaka · Bangladesh in bio","Set up SSH key (follow GitHub official guide) — no more password prompts","1 commit minimum every single day — the streak starts today"],"eng":["All READMEs in English — no exceptions from day 1","All commit messages in English: \"Add calculator script with division by zero handling\"","Watch 1 tech YouTube video in English daily (Fireship, CS50) — no subtitles"]},"note":"<strong>The most important week.</strong> Not because of the code — because of the habits. Git streak day 1. English README day 1. HackerRank day 1. Everything compounds from here."},{"n":2,"title":"Data Structures + Control Flow","phase":"Python Foundations + Web Basics","badges":[],"hrs":40,"cats":{"course":["Strings, f-strings, string methods, numbers, math ops, operator precedence","If/else, logical operators, comparison operators, while loops","For loops, nested loops, break/continue, lists, tuples, sets, dictionaries + all methods, list comprehension"],"extra":["CS50P Week 1 — conditionals and loops, Harvard quality","Corey Schafer: Python Lists + Python Dictionaries on YouTube (30 min total, extremely dense value)","Big-O in 100 seconds (Fireship) — O(1), O(n), O(n²) intuition","pythontutor.com — run your loops and watch memory step by step","Understand dict.get(), .items(), .keys(), .values() — backbone of Django and JSON"],"leet":["LeetCode #1 Two Sum — 25 min timer, struggle first, approach only if stuck, implement yourself","LeetCode #412 FizzBuzz — write with loop, then rewrite with list comprehension","LeetCode #344 Reverse String — two-pointer intuition","After each: read top-voted solution, understand any better approach"],"project":["CLI To-Do App v1: add/view/delete tasks — stored in a Python list","Extend: mark as complete using list of dicts: [{\"task\": \"study\", \"done\": False}]","Word frequency counter: reads string, returns dict of {word: count} sorted by frequency"],"git":["Learn: git checkout -b feature/todo-app → commit → merge to main","Rule from now forever: one feature = one branch, even in solo projects","Create .gitignore: add __pycache__/, *.pyc, .env, venv/ — never commit these"],"eng":["Write your To-Do app README in English — what it does, how to run it, what you learned","Summarize in 3 English sentences: what is the difference between a list and a tuple?"]},"note":"<strong>Two Sum will feel impossible.</strong> That feeling is the point. Spend 25 minutes genuinely trying. The struggle is the learning — skipping it skips the growth."},{"n":3,"title":"Functions + File Handling + Error Handling","phase":"Python Foundations + Web Basics","badges":[],"hrs":40,"cats":{"course":["Functions, parameters, keyword args, return statements, decorators, lambda, scope","Reading/writing files, file paths, file methods, iterators, generators","Try/except, finally, else, raising exceptions, custom exceptions"],"extra":["CS50P Week 2 — functions and variables","Understand *args and **kwargs deeply — used everywhere in Django views","Virtual environments (venv): python -m venv env, source env/bin/activate — use for every project from now","Read Python docs on exception hierarchy — know the full tree","Corey Schafer: Decorators tutorial — decorators are used heavily in Django"],"leet":["LeetCode #125 Valid Palindrome","LeetCode #121 Best Time to Buy and Sell Stock","LeetCode #217 Contains Duplicate","For each: solve, then read top solution, note what was better"],"project":["Upgrade CLI To-Do: save/load tasks to a JSON file so data persists between runs","Add proper error handling — what if the file doesn't exist? What if input is invalid?","Push as new branch: feature/json-persistence — practice branching"],"git":["Practice: git stash, git log --oneline, git diff","Write descriptive commit messages: \"Add JSON file persistence to To-Do app\" not \"update\"","Your GitHub should show 3 repos, daily commits, readable READMEs by end of this week"],"eng":["Record yourself explaining what a decorator is in English — 60 seconds — play it back","Write a 100-word English summary of what you learned this week in your journal"]},"note":"Virtual environments are not optional. From this week every Python project gets its own venv. This prevents dependency conflicts that will waste hours later."},{"n":4,"title":"OOP — The Most Critical Python Week","phase":"Python Foundations + Web Basics","badges":["critical"],"hrs":44,"cats":{"course":["Classes, objects, instance variables, class variables, methods, constructors, static methods","Inheritance, polymorphism, method overriding, encapsulation, access modifiers","Abstract classes, design patterns: Singleton, Factory, Builder, property decorators"],"extra":["Corey Schafer: OOP Python series on YouTube — all 6 videos (3 hours total, worth every minute)","OOP is the heart of Django models — invest double time here if needed","Understand __str__, __repr__, __len__, __eq__ dunder methods — used constantly","Rewrite your To-Do CLI app using OOP: Task class, TodoList class, FileManager class","Study: Association vs Aggregation vs Composition — know the differences"],"leet":["LeetCode #206 Reverse Linked List — intro to linked list thinking","LeetCode #704 Binary Search — fundamental algorithm","LeetCode #70 Climbing Stairs — intro to dynamic programming thinking"],"project":["OOP To-Do refactor: Task class with title, done, priority attributes; TodoList class with all methods","This should feel harder than last week — it is. Push through.","Push as v2.0 tag on GitHub: git tag v2.0 && git push --tags"],"git":["Learn: git tag, semantic versioning — v1.0.0, v2.0.0","Keep the daily commit streak — day 22 to 28"],"eng":["Practice explaining OOP to a non-technical person in English — 2 minutes, record yourself","Open a Claude chat: \"Quiz me on Python OOP concepts in English\" — answer out loud"]},"note":"If you understand OOP deeply this week, Django will feel logical. If you skip OOP depth, Django will feel like magic you can't control. Choose understanding."},{"n":5,"title":"Modules, JSON, APIs + HTTP","phase":"Python Foundations + Web Basics","badges":[],"hrs":40,"cats":{"course":["Creating/using modules, built-in modules, pip packages, Python standard library","Working with dates/times (datetime), JSON module, HTTP requests, consuming APIs with requests library"],"extra":["Install and explore Postman — you will use this for the rest of the course and in jobs","Read: HTTP methods in depth — GET, POST, PUT, PATCH, DELETE — memorize what each does and when","Try OpenWeatherMap free API yourself — get an API key, make a real request, parse real JSON","Understand: what is a REST API? Watch a clear 10-minute explainer before the course covers it","requests library: .get(), .post(), response.json(), response.status_code — know these cold"],"leet":["LeetCode #20 Valid Parentheses — stack intuition","LeetCode #169 Majority Element","Review: re-solve Two Sum without looking at your solution — can you?"],"project":["Weather CLI app: call OpenWeatherMap API, parse JSON, display city weather cleanly","Handle errors: what if city not found? What if no internet? What if API is down?","Push to GitHub with README that includes: what it does, how to get an API key, example output"],"git":["Learn .env files and python-decouple — store API keys in .env, never commit them","Add .env to .gitignore — practice this now before Django where it matters even more"],"eng":["Write your Weather app README as if explaining to a client who hired you to build it","Practice saying your API key setup instructions out loud in English — imagine teaching a junior dev"]},"note":"The .env habit starts this week. An API key pushed to a public GitHub repo is a security disaster. Build the habit of protecting secrets before Django makes it critical."},{"n":6,"title":"Exam Week 1 + Git Deep Dive + LinkedIn Launch","phase":"Python Foundations + Web Basics","badges":["exam","new"],"hrs":38,"cats":{"course":["Module 1–5 exam + major assignment","Review all quizzes — reattempt any you scored under 80%"],"extra":["Git deep dive: git clone, fork, pull request workflow, git rebase basics","Set up SSH keys if not done","Study: GitHub flow — feature branch → PR → review → merge → delete branch","Read: Writing good commit messages (Chris Beams article — top Google result)","LinkedIn profile setup: photo, headline \"Full Stack Developer | Python | Django | React | Learning in public\", bio, location"],"leet":["Review all 12 problems solved so far — re-solve the ones you found hardest","LeetCode #268 Missing Number","LeetCode #136 Single Number"],"project":["Polish ALL 4 projects: clean READMEs, screenshots, correct .gitignore, no secrets committed","Enable GitHub Pages for your weather app — have a live URL","Audit your GitHub profile: pinned repos, bio, location, professional photo"],"git":["Contribute to any open-source project — even fixing a typo in a README counts","This is 1 open-source contribution on your resume and a green square on your graph","Create your first GitHub Project board — track your weekly tasks like a professional"],"eng":["LinkedIn: write your first post in English — \"I just completed my first month of full stack development. Here's what I learned...\" — even 5 likes is 5 people who saw your name","Follow 20 Python/Django developers on LinkedIn — read their content daily"]},"note":"<strong>LinkedIn starts this week, not month 8.</strong> Your first post will feel uncomfortable. Post it anyway. Developers who build in public get hired faster than those who hide until they're \"ready.\""},{"n":7,"title":"MySQL Fundamentals","phase":"Databases + HTML/CSS/JS","badges":[],"hrs":40,"cats":{"course":["SQL basics: SELECT, WHERE, COUNT/SUM/AVG/MIN/MAX, IN, NOT IN, AS","ORDER BY, LIMIT, LIKE, data types, GROUP BY, HAVING, INNER/LEFT/RIGHT/FULL JOIN"],"extra":["DB Fiddle (dbfiddle.uk) — practice SQL in browser, no install needed","SQLZoo.net — complete sections 1–6 this week","Understand 1NF, 2NF, 3NF normalization — know why they exist, not just what they are","EXPLAIN statement — run it on your queries, understand what \"full table scan\" means","Study: primary key vs unique key vs composite key — differences and when to use each"],"leet":["LeetCode SQL: Combine Two Tables, Employees Earning More Than Managers, Duplicate Emails","LeetCode code: #53 Maximum Subarray (intro to Kadane's algorithm)"],"project":["Design and build a Student Grade Database: students, subjects, grades tables","Write 10 different queries: joins, aggregations, filtering, sorting — push the .sql file to GitHub"],"git":["Create a databases repo — all SQL practice goes here, organized by week","Commit your schema separately from your queries — clear history"],"eng":["Write comments in your SQL files explaining what each query does — in English","Read one database article on dev.to in English — comment on it"]},"note":"SQL is tested in almost every backend interview. The developers who understand joins and indexing deeply get hired faster. Don't rush through this week."},{"n":8,"title":"MySQL Advanced + PostgreSQL","phase":"Databases + HTML/CSS/JS","badges":["critical"],"hrs":42,"cats":{"course":["Subqueries, correlated subqueries, CTEs, UNIQUE/DEFAULT/CHECK/FOREIGN KEY constraints, indexes","ER diagram basics, designing single-vendor e-commerce schema","PostgreSQL: DDL/DML, joins, aggregate functions, window functions, indexes, views, transactions, ACID, CTEs, JSON handling, triggers, query optimization"],"extra":["PostgreSQL > MySQL for Django production — focus more time on Postgres","Install PostgreSQL locally, connect via psql command line","Window functions: ROW_NUMBER(), RANK(), DENSE_RANK(), LAG(), LEAD() — practice all of them","ACID properties: Atomicity, Consistency, Isolation, Durability — interviewers ask this, know it cold","Learn: when to add an index, when NOT to (over-indexing slows writes)"],"leet":["LeetCode SQL: Department Highest Salary, Rank Scores, Consecutive Numbers","LeetCode code: #1 Two Sum with hashmap (if not solved optimally before)"],"project":["Design complete single-vendor e-commerce DB schema from scratch: users, products, orders, order_items, categories, payments","Draw ER diagram on drawio.com — export as image, add to GitHub repo","Write 15 queries covering everything from weeks 7–8"],"git":["Tag your databases repo: v1.0 — your first database design is a milestone"],"eng":["Explain ACID properties in English in your learning journal — if you can write it clearly, you understand it","Practice saying: \"I designed a database schema for an e-commerce system using PostgreSQL with proper indexing and foreign key constraints\" — you will say this in interviews"]},"note":"The e-commerce schema you design this week becomes the database for your Week 21 e-commerce project. Build it carefully — you're doing real architecture work."},{"n":9,"title":"Exam Week 2 + Linux + System Design Start","phase":"Databases + HTML/CSS/JS","badges":["exam","new"],"hrs":38,"cats":{"course":["Module 7–8 exam + assignment"],"extra":["Linux command line — essential for every deployment job: ls, cd, mkdir, chmod, grep, find, curl, ssh, top, ps","Install Ubuntu on WSL2 (Windows) or use native Linux — your dev environment should be Linux","Environment variables: export, .env files, how they work in production","System Design Primer on GitHub — read the introduction and \"How to approach a system design interview\" — just the first 2 sections","Start following Hussein Nasser on YouTube — best networking/backend systems explainer"],"leet":["LeetCode #141 Linked List Cycle","LeetCode #21 Merge Two Sorted Lists","LeetCode #83 Remove Duplicates from Sorted List","Track: total problems solved to date — should be 20+ by now"],"project":["Set up a proper Linux dev environment — document your setup in a README","This documentation itself is a real skill — many developers cannot explain their own setup"],"git":["Learn: git bisect — finding which commit introduced a bug","Audit all your repos — do they all have .gitignore? Clean READMEs? No secrets?"],"eng":["LinkedIn: post #2 — \"I just learned SQL and PostgreSQL. Here's the e-commerce database I designed...\" with your ER diagram image","This is your first technical post — it will feel vulnerable. Post it."]},"note":"<strong>System Design starts this week.</strong> Not because you need it all right now — because 8 weeks of slow exposure beats 1 week of cramming. 20 minutes per week on system design concepts from now on."},{"n":10,"title":"HTML — Structure of the Web","phase":"Databases + HTML/CSS/JS","badges":[],"hrs":40,"cats":{"course":["HTML syntax, heading tags, paragraphs, inline tags, lists, links, images, tables, comments, block vs inline",  in 100 Seconds\" Fireship — then watch his longer JS video — excellent English pacing","Write: explain what \"the event loop\" is in English in your journal — 100 words"]},"note":"Closures will confuse you. The event loop will confuse you. This is normal — these concepts confuse experienced developers too. Read, experiment in the console, ask Claude. Do not skip these."},{"n":14,"title":"Advanced JavaScript + Async","phase":"JavaScript + Django","badges":["critical"],"hrs":42,"cats":{"course":["ES6+: template literals, destructuring, spread/rest operator","Promises: resolve/reject, .then()/.catch()/.finally(), Promise.all/race","Async/await, Fetch API, error handling, JSON responses, building a To-Do Fetch app"],"extra":["Async JS is the #1 source of bugs in real projects — master it completely this week","Try/catch with async/await: always handle errors, never leave naked awaits","CORS: understand what it is and why it exists — you will hit this error with Django + React","Promise.all vs Promise.allSettled vs Promise.race — know when to use each","Axios vs Fetch — learn both, know the differences and trade-offs"],"leet":["LeetCode #15 3Sum (medium — your first real medium, spend 30 min)","LeetCode #11 Container with Most Water","LeetCode #167 Two Sum II","After solving: read solutions even if you solved it — there may be a better approach"],"project":["Weather App with Fetch API: real weather data, async/await, loading spinner, error messages","This is async JS in a real use case — not a tutorial exercise","Deploy to GitHub Pages — share the live link"],"git":["GitHub Actions introduction: create .github/workflows/test.yml — even a basic \"hello world\" action","CI/CD starts here — this is a huge resume signal"],"eng":["Practice \"think out loud\" coding in English: solve a LeetCode problem while narrating your thinking aloud — record yourself","This is exactly what technical interviews require — start practicing now"]},"note":"If you solve LeetCode #15 3Sum on yo // ---------- storage ----------
function load(k,d){ try{ var v=JSON.parse(localStorage.getItem(k)); return v===null?d:v; }catch(e){ return d; } }
function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); flash(); if(window.CloudSync) window.CloudSync.push(); }
var flashT;
function flash(){ var m=document.getElementById('savedMsg'); if(!m)return; m.textContent='Saved '+new Date().toLocaleTimeString()+' ✓'; clearTimeout(flashT); flashT=setTimeout(function(){ m.textContent='Auto-saved in this browser ✓'; },1800); }

var DONE = load('wt_done', {});
var CUR = load('wt_current', 13);
var selWeek = CUR;
var view = 'weekly';

var CATS = [
  { key:'course',  label:'📚 Course / Core',     pri:1, w:0.32 },
  { key:'extra',   label:'⚡ Self-study',         pri:3, w:0.18 },
  { key:'leet',    label:'🧩 LeetCode / DSA',     pri:2, w:0.12 },
  { key:'project', label:'🔨 Project',            pri:1, w:0.25 },
  { key:'git',     label:'🐙 Git / GitHub',       pri:2, w:0.05 },
  { key:'eng',     label:'🌍 English',            pri:2, w:0.08 }
];
var CATM = {}; CATS.forEach(function(c){ CATM[c.key]=c; });

function weekByN(n){ for(var i=0;i<WEEKS.length;i++){ if(WEEKS[i].n===n) return WEEKS[i]; } return null; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function taskId(n,cat,i){ return n+'_'+cat+'_'+i; }
function isDone(id){ return !!DONE[id]; }
function toggle(id,v){ if(v){ DONE[id]=1; } else { delete DONE[id]; } save('wt_done',DONE); }

function catHours(week,catKey){
  var arr = week.cats[catKey]||[]; if(!arr.length) return 0;
  var sumW = 0;
  CATS.forEach(function(c){ if(week.cats[c.key] && week.cats[c.key].length) sumW += c.w; });
  return week.hrs * (CATM[catKey].w / sumW);
}
function taskHours(week,catKey){ var arr=week.cats[catKey]||[]; if(!arr.length) return 0; return catHours(week,catKey)/arr.length; }

// ---------- weekly view ----------
function renderWeek(){
  var w = weekByN(selWeek); if(!w) return;
  document.getElementById('weekSel').value = String(selWeek);
  var tot=0, done=0;
  CATS.forEach(function(c){ var arr=w.cats[c.key]||[]; arr.forEach(function(t,i){ tot++; if(isDone(taskId(w.n,c.key,i))) done++; }); });
  document.getElementById('weekHrs').textContent = '~'+w.hrs+'h target';
  document.getElementById('weekPct').textContent = tot? Math.round(done/tot*100)+'% ('+done+'/'+tot+')' : '0%';

  var meta = '<div class="phasetag">'+esc(w.phase)+'</div>';
  if(w.badges && w.badges.length){
    meta += '<div class="badgerow">';
    w.badges.forEach(function(b){ var lab={exam:'EXAM',project:'PROJECT',new:'+ NEW SKILL',critical:'CRITICAL'}[b]||b; meta += '<span class="bdg '+b+'">'+lab+'</span>'; });
    meta += '</div>';
  }
  document.getElementById('weekMeta').innerHTML = meta;

  var html='';
  CATS.forEach(function(c){
    var arr = w.cats[c.key]||[]; if(!arr.length) return;
    html += '<div class="grp">'+c.label+' <span class="gh">~'+catHours(w,c.key).toFixed(1)+'h</span>'+(c.pri===1?' <span class="ess">MUST</span>':'')+'</div>';
    arr.forEach(function(t,i){
      var id=taskId(w.n,c.key,i); var d=isDone(id);
      html += '<label class="chk'+(d?' done':'')+'"><input type="checkbox" data-id="'+id+'" '+(d?'checked':'')+'><span>'+esc(t)+'</span></label>';
    });
  });
  if(w.note) html += '<div class="note">⚡ '+w.note+'</div>';
  document.getElementById('weekBody').innerHTML = html;
}

// ---------- remaining view ----------
function renderRemaining(){
  var groups={1:[],2:[],3:[]};
  WEEKS.forEach(function(w){
    if(w.n>CUR) return;
    CATS.forEach(function(c){
      var arr=w.cats[c.key]||[];
      arr.forEach(function(t,i){
        var id=taskId(w.n,c.key,i);
        if(!isDone(id)) groups[c.pri].push({ n:w.n, id:id, text:t, cat:c.label });
      });
    });
  });
  [1,2,3].forEach(function(p){ groups[p].sort(function(a,b){ return a.n-b.n; }); });

  var essLeft=groups[1].length, total=groups[1].length+groups[2].length+groups[3].length;
  document.getElementById('remHead').innerHTML = '<b>'+essLeft+' must-do essential'+(essLeft===1?'':'s')+'</b> + '+(groups[2].length)+' core habits + '+(groups[3].length)+' self-study items still open across Weeks 1–'+CUR+'. Tackle red first. (Set your current week above so future weeks are not flagged.)';

  var titles={1:'🔴 Must-do essentials (Course &amp; Projects) — do these first',2:'🟡 Core habits (LeetCode · Git · English)',3:'🟢 Recommended (Self-study)'};
  var html='';
  [1,2,3].forEach(function(p){
    html += '<div class="p'+p+'"><div class="rem-sec-title">'+titles[p]+' <span style="color:#8a949c;font-weight:500">('+groups[p].length+')</span></div>';
    if(!groups[p].length){ html += '<div class="rem-empty">All clear here — nothing left. ✅</div>'; }
    else { groups[p].forEach(function(it){
      html += '<label class="rem"><input type="checkbox" data-id="'+it.id+'"><span class="wn">W'+it.n+'</span><span>'+esc(it.text)+' <span class="ct">· '+it.cat+'</span></span></label>';
    }); }
    html += '</div>';
  });
  document.getElementById('remBody').innerHTML = html;
  document.getElementById('remCnt').textContent = total;
}

// ---------- overview ----------
function renderOverview(){
  var totalTasks=0, doneTasks=0, totalH=0, doneH=0, essLeft=0, weeksComplete=0;
  WEEKS.forEach(function(w){
    var wt=0, wd=0;
    CATS.forEach(function(c){
      var arr=w.cats[c.key]||[]; if(!arr.length) return;
      var th=taskHours(w,c.key);
      arr.forEach(function(t,i){
        totalTasks++; wt++; totalH+=th;
        var id=taskId(w.n,c.key,i);
        if(isDone(id)){ doneTasks++; wd++; doneH+=th; }
        else if(c.pri===1 && w.n<=CUR){ essLeft++; }
      });
    });
    if(wt>0 && wd===wt) weeksComplete++;
  });
  document.getElementById('ovWeeks').textContent = weeksComplete;
  document.getElementById('ovTasks').textContent = doneTasks;
  document.getElementById('ovHours').textContent = Math.round(doneH);
  document.getElementById('ovEss').textContent = essLeft;
  document.getElementById('ovTotH').textContent = Math.round(totalH);
  var tp = totalTasks? Math.round(doneTasks/totalTasks*100):0;
  var hp = totalH? Math.round(doneH/totalH*100):0;
  document.getElementById('ovTaskPct').textContent = tp+'%';
  document.getElementById('ovHourPct').textContent = hp+'%';
  document.getElementById('ovTaskFill').style.width = tp+'%';
  document.getElementById('ovHourFill').style.width = hp+'%';
}

function refresh(){ document.getElementById('remCnt').textContent; renderRemaining(); renderOverview(); if(view==='weekly') renderWeek(); }

// ---------- events ----------
function setView(v){
  view=v;
  ['weekly','remaining','overview'].forEach(function(x){
    document.getElementById('view-'+x).classList.toggle('hidden', x!==v);
    document.getElementById('tab-'+x).classList.toggle('active', x===v);
  });
  if(v==='weekly') renderWeek(); else if(v==='remaining') renderRemaining(); else renderOverview();
}
document.querySelectorAll('.tb').forEach(function(b){ b.addEventListener('click', function(){ setView(b.getAttribute('data-v')); }); });

function clampWeek(n){ return Math.max(1, Math.min(40, n)); }
document.getElementById('prevW').addEventListener('click', function(){ selWeek=clampWeek(selWeek-1); save('wt_sel',selWeek); renderWeek(); });
document.getElementById('nextW').addEventListener('click', function(){ selWeek=clampWeek(selWeek+1); save('wt_sel',selWeek); renderWeek(); });
document.getElementById('weekSel').addEventListener('change', function(e){ selWeek=parseInt(e.target.value,10); save('wt_sel',selWeek); renderWeek(); });
document.getElementById('curSel').addEventListener('change', function(e){ CUR=parseInt(e.target.value,10); save('wt_current',CUR); refresh(); });

// checkbox delegation
document.getElementById('weekBody').addEventListener('change', function(e){
  if(e.target && e.target.matches('input[type=checkbox]')){ toggle(e.target.getAttribute('data-id'), e.target.checked); renderWeek(); renderOverview(); document.getElementById('remCnt').textContent = countRemaining(); }
});
document.getElementById('remBody').addEventListener('change', function(e){
  if(e.target && e.target.matches('input[type=checkbox]')){ toggle(e.target.getAttribute('data-id'), e.target.checked); renderRemaining(); renderOverview(); }
});
function countRemaining(){ var c=0; WEEKS.forEach(function(w){ if(w.n>CUR) return; CATS.forEach(function(cat){ var arr=w.cats[cat.key]||[]; arr.forEach(function(t,i){ if(!isDone(taskId(w.n,cat.key,i))) c++; }); }); }); return c; }

// counters
['leetcode','streak','articles','apps'].forEach(function(id){
  var el=document.getElementById(id); el.value=load('wt_'+id,0);
  el.addEventListener('input', function(){ save('wt_'+id, Number(el.value)||0); });
});

// ---------- init ----------
(function init(){
  var ws=document.getElementById('weekSel'), cs=document.getElementById('curSel');
  WEEKS.forEach(function(w){
    var o=document.createElement('option'); o.value=String(w.n); o.textContent='Week '+w.n+' — '+w.title; ws.appendChild(o);
    var o2=document.createElement('option'); o2.value=String(w.n); o2.textContent='Week '+w.n; cs.appendChild(o2);
  });
  selWeek = load('wt_sel', CUR);
  cs.value=String(CUR); ws.value=String(selWeek);
  renderWeek(); renderRemaining(); renderOverview();
})();

// ---------- cloud sync (iPhone <-> laptop) ----------
function reloadFromStorage(){
  DONE = load('wt_done', {});
  CUR = load('wt_current', 13);
  selWeek = load('wt_sel', CUR);
  ['leetcode','streak','articles','apps'].forEach(function(id){ var el=document.getElementById(id); if(el) el.value=load('wt_'+id,0); });
  var cs=document.getElementById('curSel'); if(cs) cs.value=String(CUR);
  var ws=document.getElementById('weekSel'); if(ws) ws.value=String(selWeek);
  renderWeek(); renderRemaining(); renderOverview();
}
if(window.CloudSync){ window.CloudSync.start({ keys:['wt_done','wt_current','wt_sel','wt_leetcode','wt_streak','wt_articles','wt_apps'], onData: reloadFromStorage }); }
</script>
</body>
